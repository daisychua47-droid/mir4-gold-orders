<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIR4 GOLD - Admin Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 15px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.back {
    border: none;
    border-radius: 7px;
    padding: 9px 15px;
    background: #334155;
    color: #ffffff;
    cursor: pointer;
    font-weight: bold;
}

.order-info {
    background: #202c3d;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
}

.order-info h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.info-item {
    color: #94a3b8;
    font-size: 13px;
}

.info-item strong {
    display: block;
    margin-top: 5px;
    color: #ffffff;
    font-size: 14px;
}

.chat-box {
    background: #182233;
    border-radius: 12px;
    overflow: hidden;
}

.chat-header {
    padding: 15px 18px;
    border-bottom: 1px solid #2d394b;
    font-weight: bold;
}

.messages {
    min-height: 400px;
    max-height: 550px;
    overflow-y: auto;
    padding: 18px;
}

.message {
    margin-bottom: 16px;
    max-width: 80%;
}

.message.customer {
    margin-right: auto;
}

.message.admin {
    margin-left: auto;
    text-align: right;
}

 /* =========================================
   FORCE CHAT MESSAGE POSITION
   ========================================= */

.message {
    display: flex;
    flex-direction: column;
    width: fit-content;
    max-width: 80%;
}

.message.customer {
    margin-right: auto;
    margin-left: 0;
    align-items: flex-start;
    text-align: left;
}

.message.admin {
    margin-left: auto;
    margin-right: 0;
    align-items: flex-end;
    text-align: right;
}

/* Bubble itself */
.message .bubble {
    width: fit-content;
    max-width: 100%;
}

/* Text inside bubble */
.message.customer .bubble {
    text-align: left;
}

.message.admin .bubble {
    text-align: left;
}

/* Image bubble */
.image-bubble {
    padding: 6px !important;
    overflow: hidden;
}

/* Actual image */
.chat-image {
    display: block;
    width: auto;
    max-width: 420px;
    max-height: 500px;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
    object-fit: contain;
}

/* Customer image = left */
.message.customer .image-bubble {
    margin-left: 0;
    margin-right: auto;
}

/* Admin image = right */
.message.admin .image-bubble {
    margin-left: auto;
    margin-right: 0;
}

@media (max-width: 600px) {

    .message {
        max-width: 90%;
    }

    .chat-image {
        max-width: 280px;
        max-height: 400px;
    }
}   

.sender {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 5px;
}

.bubble {
    display: inline-block;
    padding: 11px 14px;
    border-radius: 12px;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
}

.customer .bubble {
    background: #2563eb;
}

.admin .bubble {
    background: #475569;
}

.time {
    margin-top: 4px;
    font-size: 10px;
    color: #718096;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 100px 20px;
}

.loading {
    text-align: center;
    color: #94a3b8;
    padding: 80px 20px;
}

.error {
    background: #3f1d1d;
    color: #fecaca;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.composer {
    border-top: 1px solid #2d394b;
    padding: 15px;
    display: flex;
    gap: 10px;
}

.composer textarea {
    flex: 1;
    min-height: 48px;
    max-height: 130px;
    resize: vertical;

    border: 1px solid #3b4759;
    border-radius: 8px;

    background: #101827;
    color: #ffffff;

    padding: 12px;
    font-size: 14px;
    outline: none;
}

.composer textarea:focus {
    border-color: #64748b;
}

.send {
    border: none;
    border-radius: 8px;
    padding: 0 22px;

    background: #ffffff;
    color: #111827;

    font-weight: bold;
    cursor: pointer;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.closed {
    padding: 18px;
    text-align: center;
    color: #fca5a5;
    border-top: 1px solid #2d394b;
}

 .attach {
    width: 45px;
    min-width: 45px;
    border: 1px solid #3b4759;
    border-radius: 8px;
    background: #182233;
    color: #ffffff;
    font-size: 20px;
    cursor: pointer;
}

.attach:hover {
    background: #334155;
}

.image-preview {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 15px;
    border-top: 1px solid #2d394b;
    background: #111b2b;
}

.image-preview img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid #475569;
}

.preview-info {
    flex: 1;
    min-width: 0;
}

.preview-info strong {
    display: block;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.preview-info small {
    display: block;
    color: #94a3b8;
    margin-top: 4px;
}

#removeImage {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: #991b1b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.image-bubble {
    padding: 6px !important;
}

.chat-image {
    display: block;
    max-width: 420px;
    max-height: 420px;
    width: auto;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
}

@media (max-width: 600px) {

    .chat-image {
        max-width: 280px;
        max-height: 350px;
    }

    .composer {
        flex-wrap: wrap;
    }

    .attach {
        height: 48px;
    }
}   

@media (max-width: 600px) {

    .container {
        padding: 15px 10px;
    }

    .header h1 {
        font-size: 20px;
    }

    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .message {
        max-width: 90%;
    }

    .composer {
        flex-direction: column;
    }

    .send {
        height: 45px;
    }
}

 .chat-image {
    display: block;
    max-width: 300px;
    max-height: 300px;
    width: auto;
    height: auto;
    border-radius: 10px;
    cursor: pointer;
}

.image-bubble {
    padding: 6px !important;
}

.image-bubble .chat-image {
    margin: 0;
}   

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>MIR4 GOLD — ADMIN CHAT</h1>

        <button class="back" onclick="goBack()">
            BACK
        </button>

    </div>


    <div id="loading" class="loading">
        Loading order...
    </div>


    <div id="error" style="display:none;"></div>


    <div id="content" style="display:none;">

        <div class="order-info">

            <h2 id="orderNumber">
                ORDER
            </h2>

            <div class="info-grid">

                <div class="info-item">
                    Customer
                    <strong id="customer"></strong>
                </div>

                <div class="info-item">
                    Server
                    <strong id="server"></strong>
                </div>

                <div class="info-item">
                    Gold
                    <strong id="gold"></strong>
                </div>

                <div class="info-item">
                    Status
                    <strong id="status"></strong>
                </div>

            </div>

        </div>


        <div class="chat-box">

            <div class="chat-header">
                Customer Conversation
            </div>


            <div id="messages" class="messages">

                <div class="empty">
                    No messages yet.
                </div>

            </div>


            <div id="composer" class="composer">

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/png,image/jpeg,image/webp"
                        style="display:none;"
                    >
                
                    <button
                        type="button"
                        id="attachButton"
                        class="attach"
                        title="Send image"
                    >
                        📎
                    </button>
                
                    <textarea
                        id="messageInput"
                        placeholder="Type your reply..."
                    ></textarea>
                
                    <button
                        id="sendButton"
                        class="send"
                    >
                        SEND
                    </button>
                
                </div>
                
                <div
                    id="imagePreview"
                    class="image-preview"
                    style="display:none;"
                >
                    <img id="previewImage">
                
                    <div class="preview-info">
                        <strong id="previewName"></strong>
                        <small id="previewSize"></small>
                    </div>
                
                    <button
                        type="button"
                        id="removeImage"
                    >
                        ×
                    </button>
                </div>

            <div
                id="closedMessage"
                class="closed"
                style="display:none;"
            >
                This order is closed.
            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin-chat.js"></script>

</body>

</html>
