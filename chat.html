<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIR4 GOLD - Order Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 25px 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #9ca8ba;
        }

        .order-info {
            background: #202c3d;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .order-info h2 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 0;
            color: #cbd5e1;
        }

        .info-row strong {
            color: #ffffff;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #334155;
            font-size: 13px;
            font-weight: bold;
        }

        .chat-box {
            background: #182233;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 18px;
            border-bottom: 1px solid #2d394b;
            font-weight: bold;
        }

        .messages {
            min-height: 120px;
            max-height: 380px;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }

        .message.customer {
            margin-left: 0 !important;
            margin-right: auto !important;
            text-align: left !important;
            align-items: flex-start !important;
        }
        
        .message.admin {
            margin-left: auto !important;
            margin-right: 0 !important;
            text-align: right !important;
            align-items: flex-end !important;
        }


        .message {
    display: flex;
    flex-direction: column;
    max-width: 80%;
}

.message .bubble {
    text-align: left;
}

.image-bubble {
    padding: 6px !important;
}

.chat-image {
    display: block;
    max-width: 420px;
    max-height: 500px;
    width: auto;
    height: auto;
    border-radius: 8px;
    object-fit: contain;
}

/* CUSTOMER IMAGE = LEFT */
.message.customer .image-bubble {
    margin-left: 0 !important;
    margin-right: auto !important;
}

/* ADMIN IMAGE = RIGHT */
.message.admin .image-bubble {
    margin-left: auto !important;
    margin-right: 0 !important;
}

@media (max-width: 600px) {
    .message {
        max-width: 90%;
    }

    .chat-image {
        max-width: 280px;
        max-height: 400px;
    }
}














        

        .sender {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .bubble {
            display: inline-block;
            padding: 11px 14px;
            border-radius: 12px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .customer .bubble {
            background: #2563eb;
        }

        .admin .bubble {
            background: #334155;
        }

        .chat-image {
            display: block;
            max-width: 280px;
            max-height: 280px;
            width: auto;
            height: auto;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
            object-fit: contain;
        }

        .customer .chat-image {
            margin-left: auto;
        }

        .admin .chat-image {
            margin-right: auto;
        }

        .time {
            margin-top: 4px;
            font-size: 10px;
            color: #718096;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 80px 20px;
        }

        .composer {
            border-top: 1px solid #2d394b;
            padding: 15px;
        }

        .composer-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .composer textarea {
            flex: 1;
            min-height: 48px;
            max-height: 120px;
            resize: vertical;
            border: 1px solid #3b4759;
            border-radius: 8px;
            background: #101827;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .composer textarea:focus {
            border-color: #64748b;
        }

        .image-button {
            width: 48px;
            border: 1px solid #3b4759;
            border-radius: 8px;
            background: #202c3d;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .image-button:hover {
            background: #334155;
        }

        .send-button {
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            background: #ffffff;
            color: #111827;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:disabled,
        .image-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-preview {
            display: none;
            margin-bottom: 10px;
            padding: 10px;
            background: #101827;
            border: 1px solid #3b4759;
            border-radius: 8px;
        }

        .image-preview-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .image-preview img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .image-preview-info {
            flex: 1;
            min-width: 0;
        }

        .image-preview-name {
            font-size: 13px;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-preview-size {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .remove-image {
            border: none;
            background: #7f1d1d;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .upload-status {
            display: none;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .closed-message {
            padding: 18px;
            text-align: center;
            color: #fca5a5;
            border-top: 1px solid #2d394b;
        }

        .error {
            background: #3f1d1d;
            color: #fecaca;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 80px 20px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 18px 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .info-row {
                font-size: 14px;
            }

            .message {
                max-width: 90%;
            }

            .composer-row {
                display: grid;
                grid-template-columns: 48px 1fr;
            }

            .composer textarea {
                grid-column: 2;
                grid-row: 1;
            }

            .image-button {
                grid-column: 1;
                grid-row: 1;
            }

            .send-button {
                grid-column: 1 / 3;
                height: 45px;
            }

            .chat-image {
                max-width: 230px;
                max-height: 230px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>MIR4 GOLD</h1>
        <p>Order Chat</p>
    </div>

    <div id="loading" class="loading">
        Loading your order...
    </div>

    <div id="error" style="display:none;"></div>

    <div id="orderContent" style="display:none;">

        <div class="order-info">

            <h2 id="orderNumber">ORDER</h2>

            <div class="info-row">
                <span>Server</span>
                <strong id="server"></strong>
            </div>

            <div class="info-row">
                <span>Gold</span>
                <strong id="gold"></strong>
            </div>

            <div class="info-row">
                <span>Status</span>
                <span id="status" class="status"></span>
            </div>

        </div>

        <div class="chat-box">

            <div class="chat-header">
                Messages
            </div>

            <div id="messages" class="messages">
            </div>

            <div id="composer" class="composer">

                <!-- IMAGE PREVIEW -->

                <div id="imagePreview" class="image-preview">

                    <div class="image-preview-content">

                        <img id="previewImage" src="" alt="Preview">

                        <div class="image-preview-info">

                            <div
                                id="previewName"
                                class="image-preview-name">
                            </div>

                            <div
                                id="previewSize"
                                class="image-preview-size">
                            </div>

                        </div>

                        <button
                            type="button"
                            id="removeImage"
                            class="remove-image">
                            ×
                        </button>

                    </div>

                </div>

                <!-- UPLOAD STATUS -->

                <div
                    id="uploadStatus"
                    class="upload-status">
                    Uploading image...
                </div>

                <!-- COMPOSER -->

                <div class="composer-row">

                    <button
                        type="button"
                        id="imageButton"
                        class="image-button"
                        title="Send image">
                        📎
                    </button>

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/png,image/jpeg,image/webp"
                        style="display:none;">

                    <textarea
                        id="messageInput"
                        placeholder="Type your message..."
                    ></textarea>

                    <button
                        type="button"
                        id="sendButton"
                        class="send-button">
                        SEND
                    </button>

                </div>

            </div>

            <div
                id="closedMessage"
                class="closed-message"
                style="display:none;">
                This order is closed.
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="chat.js"></script>

</body>
</html>
