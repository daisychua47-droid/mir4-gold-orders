<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Gold - MIR4</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MIR4 GOLD</h1>
    <p>Place Your Order</p>
</header>

<main>
    <section class="card">

        <h2>Customer Order</h2>

        <form id="orderForm">

             <label for="contactName">Discord / Facebook Name</label>
            <input
                type="text"
                id="contactName"
                placeholder="Enter your Discord or Facebook name"
                required
            >
            <label for="server">MIR4 Server</label>
            <input
                type="text"
                id="server"
                placeholder="Example: ASIA 123"
                required
            >

            <label for="gold">Gold Quantity</label>
            <input
                type="number"
                id="gold"
                placeholder="Enter gold quantity"
                min="1"
                required
            >

            <label for="notes">Notes</label>
            <textarea
                id="notes"
                placeholder="Additional information (optional)"
                rows="4"
            ></textarea>

            <button type="submit">
                SUBMIT ORDER
            </button>

        </form>

        <div id="message"></div>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
