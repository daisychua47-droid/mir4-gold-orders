<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MIR4 GOLD - Reset Password</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #ffffff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .box {
            width: 100%;
            max-width: 360px;

            background: #202c3d;

            padding: 28px;

            border-radius: 12px;
        }


        h1 {
            text-align: center;
            margin: 0 0 8px;
        }


        p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }


        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #475569;

            border-radius: 7px;

            background: #101827;

            color: #ffffff;
        }


        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #ffffff;

            color: #111827;

            font-weight: bold;

            cursor: pointer;
        }


        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>MIR4 GOLD</h1>

    <p>Reset Admin Password</p>


    <label for="password">
        New Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
    >


    <label for="confirmPassword">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
    >


    <button id="resetButton">
        UPDATE PASSWORD
    </button>


    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="reset-password.js"></script>


</body>

</html>
